name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-bookmarks-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: npm run check
      - name: Configure optional cloud OAuth secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          OAUTH_ENCRYPTION_KEY: ${{ secrets.OAUTH_ENCRYPTION_KEY }}
        run: |
          set -eu
          put_secret() {
            name="$1"
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4.24.3 secret put "$name"
            fi
          }
          put_secret DROPBOX_CLIENT_ID
          put_secret DROPBOX_CLIENT_SECRET
          put_secret GOOGLE_CLIENT_ID
          put_secret GOOGLE_CLIENT_SECRET
          put_secret ONEDRIVE_CLIENT_ID
          put_secret ONEDRIVE_CLIENT_SECRET
          put_secret OAUTH_ENCRYPTION_KEY
      - name: Migrate D1 and deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.24.3"
          command: |
            d1 migrations apply private-bookmarks --remote
            deploy
